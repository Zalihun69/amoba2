<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMŐBA // NEXUS</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --x-color: #00f5ff;
    --o-color: #ff2d78;
    --x-glow: rgba(0,245,255,0.6);
    --o-glow: rgba(255,45,120,0.6);
    --bg: #050510;
    --surface: rgba(255,255,255,0.03);
    --border: rgba(255,255,255,0.08);
    --win-color: #ffe600;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    min-height: 100vh;
    background: var(--bg);
    font-family: 'Space Mono', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,245,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,245,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: gridMove 20s linear infinite;
    pointer-events: none;
  }

  /* Radial glow center */
  body::after {
    content: '';
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 800px;
    height: 800px;
    background: radial-gradient(ellipse, rgba(0,245,255,0.05) 0%, transparent 70%);
    pointer-events: none;
    animation: breathe 4s ease-in-out infinite;
  }

  @keyframes gridMove {
    from { background-position: 0 0; }
    to { background-position: 60px 60px; }
  }

  @keyframes breathe {
    0%,100% { opacity:0.5; transform: translate(-50%,-50%) scale(1); }
    50% { opacity:1; transform: translate(-50%,-50%) scale(1.1); }
  }

  /* Floating particles */
  .particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    animation: floatParticle linear infinite;
    opacity: 0;
  }
  @keyframes floatParticle {
    0% { transform: translateY(100vh) translateX(0); opacity:0; }
    10% { opacity:1; }
    90% { opacity:1; }
    100% { transform: translateY(-100px) translateX(var(--drift)); opacity:0; }
  }

  .wrapper {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    padding: 40px 20px;
  }

  /* Title */
  .title-block {
    text-align: center;
  }

  h1 {
    font-family: 'Orbitron', monospace;
    font-size: clamp(2rem, 6vw, 3.5rem);
    font-weight: 900;
    letter-spacing: 0.3em;
    color: #fff;
    text-transform: uppercase;
    position: relative;
    display: inline-block;
  }

  h1::before {
    content: attr(data-text);
    position: absolute;
    inset: 0;
    color: var(--x-color);
    clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
    opacity: 0.7;
    transform: translate(-2px, -2px);
  }

  h1::after {
    content: attr(data-text);
    position: absolute;
    inset: 0;
    color: var(--o-color);
    clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
    opacity: 0.7;
    transform: translate(2px, 2px);
  }

  .subtitle {
    font-size: 0.65rem;
    letter-spacing: 0.5em;
    color: rgba(255,255,255,0.3);
    margin-top: 8px;
    text-transform: uppercase;
  }

  /* Score panel */
  .scoreboard {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 16px;
    width: 100%;
    max-width: 480px;
  }

  .score-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    position: relative;
    overflow: hidden;
    transition: all 0.3s;
  }

  .score-card::before {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: var(--card-accent, rgba(255,255,255,0.1));
    transition: all 0.3s;
  }

  .score-card.active-player::before {
    animation: scanBar 1.5s linear infinite;
  }

  @keyframes scanBar {
    0% { transform: scaleX(0); transform-origin: left; }
    50% { transform: scaleX(1); transform-origin: left; }
    50.001% { transform: scaleX(1); transform-origin: right; }
    100% { transform: scaleX(0); transform-origin: right; }
  }

  .score-card.x-card { --card-accent: var(--x-color); }
  .score-card.o-card { --card-accent: var(--o-color); }
  .score-card.draw-card { --card-accent: rgba(255,230,0,0.6); }

  .score-label {
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    margin-bottom: 8px;
  }

  .score-symbol {
    font-family: 'Orbitron', monospace;
    font-size: 1.5rem;
    font-weight: 900;
    margin-bottom: 4px;
  }

  .x-card .score-symbol { color: var(--x-color); text-shadow: 0 0 15px var(--x-glow); }
  .o-card .score-symbol { color: var(--o-color); text-shadow: 0 0 15px var(--o-glow); }
  .draw-card .score-symbol { color: var(--win-color); }

  .score-num {
    font-family: 'Orbitron', monospace;
    font-size: 2rem;
    font-weight: 700;
    color: #fff;
    transition: all 0.3s;
  }

  .score-num.bump {
    animation: scoreBump 0.4s ease;
  }

  @keyframes scoreBump {
    0% { transform: scale(1); }
    50% { transform: scale(1.4); }
    100% { transform: scale(1); }
  }

  /* Status */
  .status-bar {
    font-family: 'Orbitron', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    text-align: center;
    min-height: 24px;
    transition: all 0.4s;
  }

  .status-bar.win {
    color: var(--win-color);
    text-shadow: 0 0 20px var(--win-color);
    font-size: 1rem;
    animation: flashText 0.8s ease infinite alternate;
  }

  .status-bar.draw {
    color: var(--win-color);
    font-size: 0.9rem;
  }

  @keyframes flashText {
    from { opacity: 1; }
    to { opacity: 0.5; }
  }

  /* Board */
  .board-container {
    position: relative;
  }

  .board-glow {
    position: absolute;
    inset: -20px;
    background: radial-gradient(ellipse at center, rgba(0,245,255,0.05) 0%, transparent 70%);
    pointer-events: none;
    transition: all 0.5s;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    position: relative;
    z-index: 1;
  }

  .cell {
    width: clamp(90px, 20vw, 120px);
    height: clamp(90px, 20vw, 120px);
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', monospace;
    font-size: clamp(2rem, 7vw, 3rem);
    font-weight: 900;
    transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
    position: relative;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  .cell::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.08), transparent 70%);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .cell:hover:not(.taken)::before { opacity: 1; }

  .cell:hover:not(.taken) {
    border-color: rgba(255,255,255,0.2);
    transform: scale(1.04) translateY(-2px);
    background: rgba(255,255,255,0.04);
  }

  .cell:active:not(.taken) {
    transform: scale(0.96);
  }

  .cell.taken { cursor: default; }

  /* X style */
  .cell.x {
    color: var(--x-color);
    border-color: rgba(0,245,255,0.2);
    background: rgba(0,245,255,0.04);
    text-shadow: 0 0 20px var(--x-glow), 0 0 40px var(--x-glow);
  }

  /* O style */
  .cell.o {
    color: var(--o-color);
    border-color: rgba(255,45,120,0.2);
    background: rgba(255,45,120,0.04);
    text-shadow: 0 0 20px var(--o-glow), 0 0 40px var(--o-glow);
  }

  /* Winning cell */
  .cell.winning {
    animation: winPulse 0.7s ease-in-out infinite alternate;
    border-color: var(--win-color) !important;
    background: rgba(255,230,0,0.08) !important;
  }

  @keyframes winPulse {
    from {
      box-shadow: 0 0 20px rgba(255,230,0,0.3), inset 0 0 20px rgba(255,230,0,0.05);
      transform: scale(1);
    }
    to {
      box-shadow: 0 0 50px rgba(255,230,0,0.6), inset 0 0 30px rgba(255,230,0,0.1);
      transform: scale(1.05);
    }
  }

  /* Cell appear animation */
  .cell.appear {
    animation: cellAppear 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes cellAppear {
    0% { transform: scale(0) rotate(-20deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  /* Combo indicator */
  .combo-display {
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    text-align: center;
    min-height: 20px;
    color: rgba(255,255,255,0.2);
    transition: all 0.3s;
  }

  .combo-display.active {
    color: var(--win-color);
    text-shadow: 0 0 10px var(--win-color);
    animation: comboAppear 0.3s ease;
  }

  @keyframes comboAppear {
    from { transform: scale(0.8) translateY(10px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    font-family: 'Orbitron', monospace;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 12px 24px;
    border-radius: 8px;
    border: 1px solid;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .btn:hover::before { opacity: 1; }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0) scale(0.97); }

  .btn-primary {
    background: rgba(0,245,255,0.08);
    border-color: rgba(0,245,255,0.3);
    color: var(--x-color);
    box-shadow: 0 0 20px rgba(0,245,255,0.1);
  }

  .btn-primary:hover {
    background: rgba(0,245,255,0.15);
    box-shadow: 0 0 30px rgba(0,245,255,0.25);
  }

  .btn-ai {
    background: rgba(255,45,120,0.08);
    border-color: rgba(255,45,120,0.3);
    color: var(--o-color);
    box-shadow: 0 0 20px rgba(255,45,120,0.1);
  }

  .btn-ai:hover {
    background: rgba(255,45,120,0.15);
    box-shadow: 0 0 30px rgba(255,45,120,0.25);
  }

  .btn-ghost {
    background: transparent;
    border-color: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.3);
  }

  .btn-ghost:hover {
    border-color: rgba(255,255,255,0.3);
    color: rgba(255,255,255,0.7);
  }

  .btn-ai.ai-on {
    background: rgba(255,45,120,0.2);
    border-color: var(--o-color);
    box-shadow: 0 0 25px rgba(255,45,120,0.4);
    color: #fff;
  }

  /* AI thinking indicator */
  .thinking {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: none;
    align-items: center;
    gap: 6px;
    z-index: 20;
    background: rgba(5,5,16,0.9);
    padding: 12px 20px;
    border-radius: 10px;
    border: 1px solid rgba(255,45,120,0.3);
    font-family: 'Orbitron', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--o-color);
  }

  .thinking.show { display: flex; }

  .thinking-dots span {
    display: inline-block;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--o-color);
    margin: 0 2px;
    animation: dotBlink 1s ease infinite;
  }

  .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dotBlink {
    0%,80%,100% { opacity: 0.2; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1.2); }
  }

  /* Win overlay */
  .win-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    display: none;
  }

  .win-overlay.show {
    display: block;
    animation: overlayFlash 0.5s ease;
  }

  @keyframes overlayFlash {
    0% { background: rgba(255,230,0,0.15); }
    100% { background: transparent; }
  }

  /* Move history */
  .move-history {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 380px;
    min-height: 28px;
  }

  .move-chip {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid;
    animation: chipAppear 0.2s ease;
  }

  @keyframes chipAppear {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .move-chip.mx { color: var(--x-color); border-color: rgba(0,245,255,0.2); background: rgba(0,245,255,0.05); }
  .move-chip.mo { color: var(--o-color); border-color: rgba(255,45,120,0.2); background: rgba(255,45,120,0.05); }

  /* Streak display */
  .streak-display {
    display: flex;
    gap: 6px;
    align-items: center;
    justify-content: center;
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: rgba(255,255,255,0.2);
    min-height: 20px;
  }

  .streak-pip {
    width: 6px; height: 6px;
    border-radius: 50%;
    transition: all 0.3s;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .streak-pip.x-win { background: var(--x-color); box-shadow: 0 0 6px var(--x-glow); border-color: var(--x-color); }
  .streak-pip.o-win { background: var(--o-color); box-shadow: 0 0 6px var(--o-glow); border-color: var(--o-color); }
  .streak-pip.draw-r { background: var(--win-color); border-color: var(--win-color); }

  /* Mode indicator */
  .mode-tag {
    font-family: 'Orbitron', monospace;
    font-size: 0.55rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 4px;
    border: 1px solid;
    text-align: center;
  }

  .mode-tag.pvp { color: rgba(255,255,255,0.3); border-color: rgba(255,255,255,0.1); }
  .mode-tag.pva { color: var(--o-color); border-color: rgba(255,45,120,0.3); background: rgba(255,45,120,0.06); }

  /* Scanline overlay */
  .scanlines {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 100;
    opacity: 0.4;
  }

  /* Corner decorations */
  .corner-deco {
    position: fixed;
    width: 60px;
    height: 60px;
    opacity: 0.15;
    pointer-events: none;
  }
  .corner-deco.tl { top: 20px; left: 20px; border-top: 2px solid var(--x-color); border-left: 2px solid var(--x-color); }
  .corner-deco.tr { top: 20px; right: 20px; border-top: 2px solid var(--o-color); border-right: 2px solid var(--o-color); }
  .corner-deco.bl { bottom: 20px; left: 20px; border-bottom: 2px solid var(--x-color); border-left: 2px solid var(--x-color); }
  .corner-deco.br { bottom: 20px; right: 20px; border-bottom: 2px solid var(--o-color); border-right: 2px solid var(--o-color); }

  /* Responsive */
  @media (max-width: 400px) {
    .scoreboard { max-width: 340px; gap: 10px; }
    .score-num { font-size: 1.5rem; }
    .controls { gap: 8px; }
    .btn { padding: 10px 16px; font-size: 0.58rem; }
  }
</style>
</head>
<body>

<div class="scanlines"></div>
<div class="win-overlay" id="winOverlay"></div>
<div class="corner-deco tl"></div>
<div class="corner-deco tr"></div>
<div class="corner-deco bl"></div>
<div class="corner-deco br"></div>
<div class="particles" id="particles"></div>

<div class="wrapper">

  <div class="title-block">
    <h1 data-text="AMŐBA">AMŐBA</h1>
    <div class="subtitle">NEXUS // v2.0 // tactical grid</div>
  </div>

  <div class="scoreboard">
    <div class="score-card x-card" id="xCard">
      <div class="score-label">X // JÁTÉKOS</div>
      <div class="score-symbol">✕</div>
      <div class="score-num" id="scoreX">0</div>
    </div>
    <div class="score-card draw-card">
      <div class="score-label">DÖNTETLEN</div>
      <div class="score-symbol">//</div>
      <div class="score-num" id="scoreDraw">0</div>
    </div>
    <div class="score-card o-card" id="oCard">
      <div class="score-label">O // JÁTÉKOS</div>
      <div class="score-symbol">○</div>
      <div class="score-num" id="scoreO">0</div>
    </div>
  </div>

  <div class="streak-display" id="streakDisplay"></div>

  <div class="mode-tag pvp" id="modeTag">PvP // KÉT JÁTÉKOS</div>
  <div class="status-bar" id="status">X JÁTÉKOS KÖVETKEZIK</div>

  <div class="board-container">
    <div class="board-glow" id="boardGlow"></div>
    <div class="board" id="board">
      <button class="cell" data-index="0"></button>
      <button class="cell" data-index="1"></button>
      <button class="cell" data-index="2"></button>
      <button class="cell" data-index="3"></button>
      <button class="cell" data-index="4"></button>
      <button class="cell" data-index="5"></button>
      <button class="cell" data-index="6"></button>
      <button class="cell" data-index="7"></button>
      <button class="cell" data-index="8"></button>
    </div>
    <div class="thinking" id="thinking">
      <span>AI GONDOLKODIK</span>
      <div class="thinking-dots"><span></span><span></span><span></span></div>
    </div>
  </div>

  <div class="combo-display" id="comboDisplay"></div>
  <div class="move-history" id="moveHistory"></div>

  <div class="controls">
    <button class="btn btn-primary" id="resetBtn">⟳ ÚJ JÁTÉK</button>
    <button class="btn btn-ai" id="aiBtn">// AI MÓD</button>
    <button class="btn btn-ghost" id="undoBtn">↩ VISSZAVON</button>
  </div>

</div>

<script>
const cells = document.querySelectorAll('.cell');
const statusEl = document.getElementById('status');
const resetBtn = document.getElementById('resetBtn');
const aiBtn = document.getElementById('aiBtn');
const undoBtn = document.getElementById('undoBtn');
const scoreXEl = document.getElementById('scoreX');
const scoreOEl = document.getElementById('scoreO');
const scoreDrawEl = document.getElementById('scoreDraw');
const winOverlay = document.getElementById('winOverlay');
const boardGlow = document.getElementById('boardGlow');
const thinkingEl = document.getElementById('thinking');
const comboEl = document.getElementById('comboDisplay');
const moveHistoryEl = document.getElementById('moveHistory');
const streakEl = document.getElementById('streakDisplay');
const modeTagEl = document.getElementById('modeTag');
const xCard = document.getElementById('xCard');
const oCard = document.getElementById('oCard');

let board = Array(9).fill('');
let currentPlayer = 'X';
let gameActive = true;
let aiMode = false;
let aiThinking = false;
let scores = { X:0, O:0, draw:0 };
let moveHistory = [];
let resultHistory = [];
let winStreak = { player:'', count:0 };

const winPatterns = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

const posNames = ['A1','B1','C1','A2','B2','C2','A3','B3','C3'];

// Particles
function createParticles() {
  const container = document.getElementById('particles');
  for(let i=0;i<25;i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const isX = Math.random() > 0.5;
    p.style.cssText = `
      left:${Math.random()*100}%;
      background:${isX?'var(--x-color)':'var(--o-color)'};
      animation-duration:${8+Math.random()*15}s;
      animation-delay:${Math.random()*15}s;
      --drift:${(Math.random()-0.5)*200}px;
      width:${1+Math.random()*2}px;
      height:${1+Math.random()*2}px;
    `;
    container.appendChild(p);
  }
}

createParticles();

function updateActiveCard() {
  xCard.classList.toggle('active-player', currentPlayer==='X' && gameActive);
  oCard.classList.toggle('active-player', currentPlayer==='O' && gameActive);
  boardGlow.style.background = currentPlayer==='X'
    ? 'radial-gradient(ellipse at center, rgba(0,245,255,0.06) 0%, transparent 70%)'
    : 'radial-gradient(ellipse at center, rgba(255,45,120,0.06) 0%, transparent 70%)';
}

function handleCellClick(e) {
  const cell = e.currentTarget;
  const idx = parseInt(cell.dataset.index);
  if(board[idx]!==''||!gameActive||aiThinking) return;
  makeMove(idx, currentPlayer);
  if(gameActive && aiMode && currentPlayer==='O') {
    doAiMove();
  }
}

function makeMove(idx, player) {
  board[idx] = player;
  const cell = cells[idx];
  cell.textContent = player==='X'?'✕':'○';
  cell.classList.add('taken', player.toLowerCase(), 'appear');
  cell.removeEventListener('click', handleCellClick);
  moveHistory.push({idx, player});
  addMoveChip(idx, player);
  cell.addEventListener('animationend', ()=>cell.classList.remove('appear'), {once:true});

  const win = checkWin();
  if(win) {
    endGame('win', player, win);
    return;
  }
  if(checkDraw()) {
    endGame('draw', null, null);
    return;
  }

  currentPlayer = player==='X'?'O':'X';
  statusEl.textContent = `${currentPlayer} JÁTÉKOS KÖVETKEZIK`;
  statusEl.className = 'status-bar';
  updateActiveCard();
  showCombo();
}

function doAiMove() {
  aiThinking = true;
  thinkingEl.classList.add('show');
  const delay = 400 + Math.random()*400;
  setTimeout(()=>{
    const idx = getBestMove();
    thinkingEl.classList.remove('show');
    aiThinking = false;
    makeMove(idx, 'O');
  }, delay);
}

function getBestMove() {
  // Check if AI can win
  for(let i=0;i<9;i++){
    if(board[i]===''){
      board[i]='O';
      if(checkWinSilent('O')) { board[i]=''; return i; }
      board[i]='';
    }
  }
  // Block X
  for(let i=0;i<9;i++){
    if(board[i]===''){
      board[i]='X';
      if(checkWinSilent('X')) { board[i]=''; return i; }
      board[i]='';
    }
  }
  // Minimax
  let bestVal = -Infinity, bestMove = -1;
  for(let i=0;i<9;i++){
    if(board[i]===''){
      board[i]='O';
      const val = minimax(board, 0, false);
      board[i]='';
      if(val>bestVal){ bestVal=val; bestMove=i; }
    }
  }
  return bestMove;
}

function minimax(b, depth, isMax) {
  if(checkWinSilent('O')) return 10-depth;
  if(checkWinSilent('X')) return depth-10;
  if(b.every(c=>c!=='')) return 0;
  if(isMax) {
    let best=-Infinity;
    for(let i=0;i<9;i++) if(b[i]===''){b[i]='O'; best=Math.max(best,minimax(b,depth+1,false)); b[i]='';}
    return best;
  } else {
    let best=Infinity;
    for(let i=0;i<9;i++) if(b[i]===''){b[i]='X'; best=Math.min(best,minimax(b,depth+1,true)); b[i]='';}
    return best;
  }
}

function checkWinSilent(player) {
  return winPatterns.some(([a,b,c])=>board[a]===player&&board[b]===player&&board[c]===player);
}

function checkWin() {
  for(const p of winPatterns){
    const [a,b,c]=p;
    if(board[a]&&board[a]===board[b]&&board[a]===board[c]) return p;
  }
  return null;
}

function checkDraw() { return board.every(c=>c!==''); }

function endGame(type, player, winPattern) {
  gameActive = false;
  cells.forEach(c=>c.removeEventListener('click',handleCellClick));

  if(type==='win') {
    winPattern.forEach(i=>cells[i].classList.add('winning'));
    statusEl.textContent = `🏆 ${player} JÁTÉKOS NYERT!`;
    statusEl.className = 'status-bar win';
    scores[player]++;
    bumpScore(player);
    flashWinOverlay();
    spawnConfetti(player);
    resultHistory.push(player);
  } else {
    statusEl.textContent = '// DÖNTETLEN //';
    statusEl.className = 'status-bar draw';
    scores.draw++;
    bumpScore('draw');
    resultHistory.push('D');
  }

  updateStreak(type==='win'?player:'D');
  renderStreak();
  updateActiveCard();
  xCard.classList.remove('active-player');
  oCard.classList.remove('active-player');
}

function bumpScore(p) {
  const el = p==='X'?scoreXEl:p==='O'?scoreOEl:scoreDrawEl;
  el.textContent = p==='X'?scores.X:p==='O'?scores.O:scores.draw;
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
}

function flashWinOverlay() {
  winOverlay.classList.remove('show');
  void winOverlay.offsetWidth;
  winOverlay.classList.add('show');
}

function spawnConfetti(player) {
  const color = player==='X'?'var(--x-color)':'var(--o-color)';
  for(let i=0;i<30;i++) {
    setTimeout(()=>{
      const d = document.createElement('div');
      d.style.cssText = `
        position:fixed;
        width:${4+Math.random()*6}px;
        height:${4+Math.random()*6}px;
        border-radius:${Math.random()>0.5?'50%':'2px'};
        background:${color};
        left:${20+Math.random()*60}%;
        top:${20+Math.random()*40}%;
        animation: confettiFall 1.5s ease forwards;
        pointer-events:none;
        z-index:200;
        box-shadow:0 0 6px ${color};
      `;
      document.body.appendChild(d);
      setTimeout(()=>d.remove(),1600);
    }, i*30);
  }
}

// Add confetti keyframes
const cStyle = document.createElement('style');
cStyle.textContent = `@keyframes confettiFall {
  0%{transform:translate(0,0) rotate(0deg);opacity:1;}
  100%{transform:translate(${(Math.random()-0.5)*300}px,${150+Math.random()*200}px) rotate(${360+Math.random()*360}deg);opacity:0;}
}`;
document.head.appendChild(cStyle);

function showCombo() {
  const moveCount = moveHistory.length;
  if(moveCount===5) { comboEl.textContent='// MID-GAME //'; comboEl.className='combo-display active'; }
  else if(moveCount===7) { comboEl.textContent='// KRITIKUS PONT //'; comboEl.className='combo-display active'; }
  else if(moveCount>=3) {
    const last3 = moveHistory.slice(-3).map(m=>m.player);
    if(last3.every(p=>p===last3[0])) {
      comboEl.textContent=`// ${last3[0]} SOROZAT //`;
      comboEl.className='combo-display active';
    } else {
      comboEl.textContent='';
      comboEl.className='combo-display';
    }
  }
}

function addMoveChip(idx, player) {
  const chip = document.createElement('div');
  chip.className = `move-chip m${player.toLowerCase()}`;
  chip.textContent = `${player}:${posNames[idx]}`;
  moveHistoryEl.appendChild(chip);
}

function updateStreak(result) {
  if(result===winStreak.player) { winStreak.count++; }
  else { winStreak = {player:result, count:1}; }
}

function renderStreak() {
  streakEl.innerHTML='';
  const last8 = resultHistory.slice(-8);
  if(last8.length===0) return;
  last8.forEach(r=>{
    const pip = document.createElement('div');
    pip.className = `streak-pip ${r==='X'?'x-win':r==='O'?'o-win':'draw-r'}`;
    streakEl.appendChild(pip);
  });
  if(winStreak.count>=2) {
    const label = document.createElement('span');
    label.textContent = `  ${winStreak.player==='D'?'DÖNTETLEN':winStreak.player} ×${winStreak.count}`;
    streakEl.appendChild(label);
  }
}

function resetGame() {
  board = Array(9).fill('');
  gameActive = true;
  currentPlayer = 'X';
  moveHistory = [];
  aiThinking = false;

  statusEl.textContent = 'X JÁTÉKOS KÖVETKEZIK';
  statusEl.className = 'status-bar';
  comboEl.textContent = '';
  comboEl.className = 'combo-display';
  moveHistoryEl.innerHTML = '';
  thinkingEl.classList.remove('show');

  cells.forEach(c=>{
    c.textContent='';
    c.classList.remove('taken','x','o','winning','appear');
    c.removeEventListener('click',handleCellClick);
    c.addEventListener('click',handleCellClick);
  });

  updateActiveCard();
}

function toggleAI() {
  aiMode = !aiMode;
  aiBtn.classList.toggle('ai-on', aiMode);
  modeTagEl.textContent = aiMode ? 'PvA // MESTERSÉGES INTELLIGENCIA' : 'PvP // KÉT JÁTÉKOS';
  modeTagEl.className = `mode-tag ${aiMode?'pva':'pvp'}`;
  resetGame();
}

function undoMove() {
  if(moveHistory.length===0||!gameActive) return;
  let undoCount = 1;
  if(aiMode && moveHistory.length>=2) undoCount = 2;

  for(let i=0;i<undoCount;i++){
    if(moveHistory.length===0) break;
    const last = moveHistory.pop();
    board[last.idx]='';
    const cell = cells[last.idx];
    cell.textContent='';
    cell.classList.remove('taken','x','o','winning','appear');
    cell.removeEventListener('click',handleCellClick);
    cell.addEventListener('click',handleCellClick);
    moveHistoryEl.lastChild?.remove();
  }

  currentPlayer = moveHistory.length===0?'X':
    (moveHistory[moveHistory.length-1].player==='X'?'O':'X');
  statusEl.textContent = `${currentPlayer} JÁTÉKOS KÖVETKEZIK`;
  statusEl.className = 'status-bar';
  comboEl.textContent='';
  comboEl.className='combo-display';
  updateActiveCard();
}

// Init
cells.forEach(c=>c.addEventListener('click',handleCellClick));
resetBtn.addEventListener('click',resetGame);
aiBtn.addEventListener('click',toggleAI);
undoBtn.addEventListener('click',undoMove);
updateActiveCard();
</script>
</body>
</html>
